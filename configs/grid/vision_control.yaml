# Positive control, paper-faithful: Achille, Rovere & Soatto (ICLR 2019), CIFAR-10 / ResNet-18.
# Protocol: deficit (blur = 8x8 downsample + bilinear upsample) for the first t0 epochs, then 160 clean epochs;
# SGD lr 0.1 x 0.97 per epoch, momentum 0.9, wd 5e-4, batch 128. Window = [0, t0/(160+t0)] of total steps.
# Arms x 3 seeds: clean(160) | blur t0=20,40,80 | blur late (epochs 80-120 of 200, recency control) |
# label permutation t0=40 (the paper's predicted null). 18 runs.
# Expected: final test accuracy falls with t0 for blur (sharply for ResNet-18 per the paper), late blur and
# label permutation recover to clean. If this does not reproduce, stop and debug the harness.
# Compute: ~690 img/s => ~80 s/epoch => 3.6-5.3 h per run, ~75 machine-hours; split by seed across machines
# (edit train.seed below per machine or run one seed's rows on each). vision.weight_decay is the SGD wd.
name: vision_control
overrides:
  task: vision
  vision.batch_size: 128
  vision.subset: null
  vision.lr_decay: 0.97
  vision.weight_decay: 0.0005
  vision.test_every_epochs: 2
  train.schedule: exp
  train.lr: 0.1
extra_runs:
- run.tag: clean
  vision.epochs: 160
  corruption:
    kind: clean
  train.seed: 0
- run.tag: blur-t20
  vision.epochs: 180
  corruption:
    kind: blur
    window:
    - 0.0
    - 0.1111
  train.seed: 0
- run.tag: blur-t40
  vision.epochs: 200
  corruption:
    kind: blur
    window:
    - 0.0
    - 0.2
  train.seed: 0
- run.tag: blur-t80
