    window:
    - 0.0
    - 0.3333
  train.seed: 0
- run.tag: blur-late40
  vision.epochs: 200
  corruption:
    kind: blur
    window:
    - 0.4
    - 0.6
  train.seed: 0
- run.tag: labelperm-t40
  vision.epochs: 200
  corruption:
    kind: label_permute
    window:
    - 0.0
    - 0.2
  train.seed: 0
- run.tag: clean
  vision.epochs: 160
