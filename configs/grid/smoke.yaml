# End-to-end smoke test (~1 min per run at xs). Exercises: per-seed document order (two clean seeds), a
# corrupted-stream window, the vocabulary-permutation negative control, a half-dose arm, bootstrap CIs and
# plasticity metrics. Needs streams: clean, shuffle_sentence, shuffle_sentence@0.5.
name: smoke
overrides:
  model.size: xs
  train.tokens: 3_000_000
  train.batch_tokens: 16384
  train.schedule: const
  eval.every_tokens: 1_000_000
  eval.val_tokens: 100_000
  eval.blimp_per_paradigm: 20
  eval.blimp_final_full: false
  checkpoint.every_tokens: 1_500_000
axes:
  corruption:
    - {kind: clean}
    - {kind: shuffle_sentence, window: [0.0, 0.5]}
    - {kind: shuffle_sentence, window: [0.0, 0.5], intensity: 0.5}
    - {kind: vocab_permute, window: [0.0, 0.5]}
  train.seed: [0]
extra_runs:
  - {corruption: {kind: clean}, train.seed: 1}
